name: Python Pipeline CI/CD Quality Control

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      # Spin up a live Redis server service inside the runner loop context for test mapping execution
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code Repository Base
      uses: actions/checkout@v4

    - name: Set up Python Environment (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Environment Requirements
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy scikit-learn matplotlib plotly fastapi uvicorn redis requests

    - name: Execute Automated Regression Test Suites
      env:
        REDIS_HOST: localhost
      run: |
        cd backend
        pytest test_main.py -v --disable-warnings
